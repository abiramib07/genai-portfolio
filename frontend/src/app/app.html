@if (data()) {
  <app-navbar [personal]="data().personal" />
  <main>
    <app-hero [personal]="data().personal" [stats]="data().stats" />
    <app-about [personal]="data().personal" [stats]="data().stats" />
    <app-skills [skills]="data().skills" />
    <app-experience [experience]="data().experience" />
    <app-achievements [achievements]="data().achievements" />
    <app-education [education]="data().education" />
    <app-contact [personal]="data().personal" />
  </main>
} @else {
  <div class="loader-wrap">
    <div class="loader-ring"></div>
    <span class="loader-text">Loading Portfolio...</span>
  </div>
}
