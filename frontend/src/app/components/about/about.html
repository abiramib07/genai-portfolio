<section class="about section" id="about">
  <div class="fade-up">
    <p class="section-label">// about me</p>
    <h2 class="section-title">Turning <span class="gradient-text">AI Research</span> into Production Reality</h2>
  </div>

  <div class="about-grid fade-up">
    <div class="about-text">
      <p>{{ personal.summary }}</p>
      <div class="about-meta">
        <div class="meta-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
          <a [href]="'mailto:' + personal.email">{{ personal.email }}</a>
        </div>
        <div class="meta-item">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/></svg>
          <a [href]="'https://' + personal.linkedin" target="_blank">LinkedIn Profile</a>
        </div>
      </div>
    </div>

    <div class="stats-grid">
      @for (stat of stats; track stat.label) {
        <div class="stat-card glass-card fade-up">
          <div class="stat-value gradient-text">{{ stat.value }}</div>
          <div class="stat-label">{{ stat.label }}</div>
        </div>
      }
    </div>
  </div>
</section>
