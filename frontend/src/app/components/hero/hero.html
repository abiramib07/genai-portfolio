<section class="hero" id="hero">
  <canvas #canvas class="neural-canvas"></canvas>
  <div class="hero-overlay"></div>

  <div class="hero-content">
    <div class="hero-badge">
      <span class="badge-dot"></span>
      Available for opportunities
    </div>

    <h1 class="hero-name">{{ personal.name }}</h1>

    <div class="hero-role">
      <span class="role-text">{{ displayedRole() }}</span>
      <span class="cursor">|</span>
    </div>

    <p class="hero-summary">{{ personal.summary }}</p>

    <div class="hero-actions">
      <button class="btn-primary" (click)="scrollTo('#contact')">Get In Touch</button>
      <a class="btn-outline" href="assets/Abirami_Resume.pdf" download target="_blank">
        <span>Download Resume</span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/>
        </svg>
      </a>
    </div>

    <div class="hero-links">
      <a [href]="'mailto:' + personal.email" class="hero-link" title="Email">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>
        </svg>
      </a>
      <a [href]="'https://' + personal.linkedin" target="_blank" class="hero-link" title="LinkedIn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6zM2 9h4v12H2z"/><circle cx="4" cy="4" r="2"/>
        </svg>
      </a>
      <a href="https://github.com/abiramib07" target="_blank" class="hero-link" title="GitHub">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
          <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"/>
        </svg>
      </a>
    </div>
  </div>

  <div class="scroll-indicator" (click)="scrollTo('#about')">
    <div class="scroll-mouse">
      <div class="scroll-wheel"></div>
    </div>
    <span>Scroll down</span>
  </div>
</section>
